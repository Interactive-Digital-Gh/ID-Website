# ==========================================================================
# Nginx Server Block — interactivedigital.com.gh
# File: /etc/nginx/sites-available/interactivedigital.com.gh
# ==========================================================================

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name interactivedigital.com.gh www.interactivedigital.com.gh;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name interactivedigital.com.gh www.interactivedigital.com.gh;

    # --- SSL Configuration ---
    # Adjust paths if your certificates are stored elsewhere
    ssl_certificate     /etc/letsencrypt/live/interactivedigital.com.gh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interactivedigital.com.gh/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Document Root ---
    root /var/www/production/ID-Website/dist;
    index index.html;

    # Hide nginx version from Server header
    server_tokens off;

    # --- Security Headers ---
    include /etc/nginx/snippets/security-headers.conf;

    # --- SPA Routing ---
    # Serve index.html for all routes (React Router handles client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Static Asset Caching ---
    # Vite generates hashed filenames, so aggressive caching is safe
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-include security headers because add_header in a location block
        # overrides headers set at the server level
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
