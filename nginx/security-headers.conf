# ==========================================================================
# Security Headers — Include this file in your nginx server blocks
# File: /etc/nginx/snippets/security-headers.conf
# ==========================================================================

# 1. Strict-Transport-Security (HSTS)
#    Forces browsers to use HTTPS for 1 year, including subdomains.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 2. Content-Security-Policy (CSP)
#    Restricts which resources the browser is allowed to load.
#    - default-src 'self'        → only allow same-origin by default
#    - script-src 'self'         → scripts from same-origin only (Vite bundles)
#      'unsafe-inline'           → needed for Vite/React inline script chunks
#    - style-src 'self'          → styles from same-origin
#      'unsafe-inline'           → needed for inline styles (Tailwind, Framer Motion)
#      fonts.googleapis.com      → Google Fonts CSS
#    - font-src 'self'           → fonts from same-origin
#      fonts.gstatic.com         → Google Fonts files
#    - img-src 'self' data: https: → images from same-origin, data URIs, and any HTTPS
#    - connect-src 'self'        → XHR/fetch to same-origin only
#    - frame-src                 → allow YouTube and Google Maps embeds
#    - object-src 'none'         → block Flash/plugins
#    - base-uri 'self'           → restrict <base> tag
#    - form-action 'self'        → restrict form submissions
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.youtube.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# 3. X-Frame-Options
#    Prevents your site from being loaded in an iframe on other domains (clickjacking).
add_header X-Frame-Options "SAMEORIGIN" always;

# 4. X-Content-Type-Options
#    Stops browsers from guessing (MIME-sniffing) the content type.
add_header X-Content-Type-Options "nosniff" always;

# 5. Referrer-Policy
#    Controls how much referrer information is sent with requests.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 6. Permissions-Policy
#    Restricts access to browser features like camera, microphone, geolocation.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# --- Upcoming / Recommended Headers ---

# 7. Cross-Origin-Embedder-Policy
#    Prevents loading cross-origin resources that don't grant permission.
#    NOTE: Using "unsafe-none" instead of "require-corp" because YouTube/Google Maps
#    embeds do not send CORP headers — "require-corp" would break them.
add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

# 8. Cross-Origin-Opener-Policy
#    Isolates browsing context from cross-origin popups.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# 9. Cross-Origin-Resource-Policy
#    Restricts who can load your resources.
add_header Cross-Origin-Resource-Policy "same-origin" always;
