name: Deploy ID Website

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.PROD_SERVER_HOST }}
          username: ${{ vars.PROD_SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/production/ID-Website
            git pull origin main
            npm ci
            npm run build

            echo "Deploying nginx security headers"
            sudo cp nginx/security-headers.conf /etc/nginx/snippets/security-headers.conf
            sudo cp nginx/interactivedigital.com.gh.conf /etc/nginx/sites-available/interactivedigital.com.gh
            sudo ln -sf /etc/nginx/sites-available/interactivedigital.com.gh /etc/nginx/sites-enabled/interactivedigital.com.gh

            echo "Validating nginx config"
            sudo nginx -t

            echo "Reloading nginx"
            sudo systemctl reload nginx

  deploy-staging:
        if: github.ref == 'refs/heads/staging'
        runs-on: ubuntu-latest

        steps:
          - name: Deploy Staging
            uses: appleboy/ssh-action@v1.2.0
            with:
              host: ${{ vars.PROD_SERVER_HOST }}
              username: ${{ vars.PROD_SERVER_USER }}
              key: ${{ secrets.SERVER_SSH_KEY }}
              script: |
                set -e

                echo "Switching to staging directory"
                cd /var/www/staging/ID-Website

                echo "Pulling latest code"
                git pull origin staging

                echo "Installing dependencies"
                npm ci

                echo "Building project"
                npm run build

                echo "Verifying dist exists"
                ls -la dist

                echo "Deploying nginx security headers"
                sudo cp nginx/security-headers.conf /etc/nginx/snippets/security-headers.conf

                echo "Validating nginx config"
                sudo nginx -t

                echo "Reloading nginx"
                sudo systemctl reload nginx